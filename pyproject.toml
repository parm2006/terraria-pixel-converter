[project]
name = "terraria-pixel-converter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "Pillow==12.3.0",
  "proper-pixel-art==1.7.2",
  "requests>=2.32,<3",
]

[tool.vercel]
entrypoint = "api.convert:handler"

[tool.uv]
exclude-dependencies = ["av"]
